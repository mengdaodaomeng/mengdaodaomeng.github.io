<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>P2P 直播 Demo（修正版）</title>
  <style>
    body { font-family: sans-serif; padding: 10px; }
    video { width: 45%; border: 1px solid #ccc; margin-right: 10px; }
    textarea { width: 100%; height: 120px; }
    button { margin: 5px 0; }
    #log { white-space: pre-line; background: #eee; padding: 10px; height: 150px; overflow-y: auto; }
  </style>
</head>
<body>
  <h2>P2P 直播 Demo（修正版）</h2>

  <div>
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <button id="btnBroadcaster">我是主播</button>
  <button id="btnViewer">我是观众</button>
  <p id="roleInfo"></p>

  <h3>本端 SDP</h3>
  <textarea id="localSdp" readonly></textarea>

  <h3>对方 SDP</h3>
  <textarea id="remoteSdp"></textarea>
  <button id="btnSetRemote">设置对方 SDP</button>

  <h3>日志输出</h3>
  <div id="log"></div>

<script>
let pc, localStream, role;

function log(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

async function startLocalMedia() {
  log("请求摄像头权限...");
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;
  log("摄像头已启动");
}

async function initPC() {
  pc = new RTCPeerConnection({
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  });

  pc.onicecandidate = e => {
    if (!e.candidate) {
      document.getElementById("localSdp").value = JSON.stringify(pc.localDescription);
      log("ICE 收集完成，本端 SDP 已生成");
    }
  };

  pc.ontrack = e => {
    log("收到远端视频流");
    document.getElementById("remoteVideo").srcObject = e.streams[0];
  };
}

document.getElementById("btnBroadcaster").onclick = async () => {
  role = "broadcaster";
  document.getElementById("roleInfo").textContent = "当前角色：主播";
  log("角色：主播");

  await startLocalMedia();
  await initPC();

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  log("创建 offer...");
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
};

document.getElementById("btnViewer").onclick = async () => {
  role = "viewer";
  document.getElementById("roleInfo").textContent = "当前角色：观众";
  log("角色：观众");

  await startLocalMedia();
  await initPC();
};

document.getElementById("btnSetRemote").onclick = async () => {
  const text = document.getElementById("remoteSdp").value.trim();
  if (!text) return alert("请粘贴对方 SDP");

  log("设置对方 SDP...");
  const remote = new RTCSessionDescription(JSON.parse(text));
  await pc.setRemoteDescription(remote);

  if (role === "viewer" && remote.type === "offer") {
    log("收到 offer，创建 answer...");
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
  }
};
</script>
</body>
</html>
