<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GitHub WebRTC Chat</title>

<style>

body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

#chat{
    border:1px solid #ccc;
    height:350px;
    overflow:auto;
    padding:10px;
    background:#f5f5f5;
    margin-top:10px;
    margin-bottom:10px;
}

input{
    width:70%;
    padding:10px;
    margin:5px;
}

button{
    padding:10px;
    margin:5px;
}

</style>

</head>
<body>

<h2>GitHub Issues WebRTC Chat</h2>

<div>

<button onclick="createRoom()">
创建房间
</button>

<button onclick="joinRoom()">
加入房间
</button>

<button onclick="clearToken()">
清除掉Token
</button>

<button onclick="disconnect()">
断开连接
</button>

</div>

<div id="chat"></div>

<input id="msg">

<button onclick="sendMsg()">
发送
</button>

<script>

const OWNER = "mengdaodaomeng";
const REPO = "mengdaodaomeng.github.io";
log("OWNER: " + OWNER);
log("REPO: " + REPO);
let pc;
let dc;

let GITHUB_TOKEN =
    localStorage.getItem("github_token") || "";

function log(t){

    const div =
        document.getElementById("chat");

    div.innerHTML += t + "<br>";

    div.scrollTop = div.scrollHeight;
}

function clearToken(){

    localStorage.removeItem(
        "github_token"
    );

    GITHUB_TOKEN = "";

    log("Token 已清除");
}

async function github(path, method="GET", body=null){

    if(!GITHUB_TOKEN){

        GITHUB_TOKEN =
            prompt("输入 GitHub Token");

        if(!GITHUB_TOKEN){

            log("未输入 Token");

            return null;
        }

        localStorage.setItem(
            "github_token",
            GITHUB_TOKEN
        );
    }

    const r = await fetch(

        "https://api.github.com" + path,

        {
            method,

            headers:{

                "Authorization":
                    "Bearer " + GITHUB_TOKEN,

                "Accept":
                    "application/vnd.github+json"
            },

            body: body
                ? JSON.stringify(body)
                : null
        }
    );

    const data = await r.json();

    console.log(data);

    if(!r.ok){

        log("GitHub错误: " + data.message);

        return null;
    }

    return data;
}

function setupPeer(){

    pc = new RTCPeerConnection({

        iceServers:[
            {
                urls:"stun:stun.l.google.com:19302"
            }
        ]
    });

    pc.onconnectionstatechange = ()=>{

        log(
            "连接状态: " +
            pc.connectionState
        );
    };

    pc.onicecandidate = (e)=>{

        if(e.candidate){

            console.log(
                "ICE:",
                e.candidate.candidate
            );
        }
    };

    pc.ondatachannel = (e)=>{

        dc = e.channel;

        setupDataChannel();
    };
}

function setupDataChannel(){

    dc.onopen = ()=>{

        log("P2P 已连接");
    };

    dc.onmessage = (e)=>{

        log("对方: " + e.data);
    };
}

async function createRoom(){

    log("创建房间...");

    setupPeer();

    dc =
        pc.createDataChannel("chat");

    setupDataChannel();

    const offer =
        await pc.createOffer();

    await pc.setLocalDescription(
        offer
    );

    await waitIce();

    const sdp =
        pc.localDescription.sdp;

    const r = await github(

        `/repos/${OWNER}/${REPO}/issues`,

        "POST",

        {
            title:"offer",
            body:sdp
        }
    );

    if(!r)return;

    log(
        "Offer 已上传"
    );

    pollAnswer();
}

async function joinRoom(){

    log("正在读取 Offer...");

    setupPeer();

    const issues =
        await github(
            `/repos/${OWNER}/${REPO}/issues`
        );

    if(!issues)return;

    let offerIssue = null;

    for(const i of issues){

        if(i.title === "offer"){

            offerIssue = i;

            break;
        }
    }

    if(!offerIssue){

        log("没有找到 Offer");

        return;
    }

    log("已找到 Offer");

    await pc.setRemoteDescription({

        type:"offer",

        sdp:offerIssue.body
    });

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(
        answer
    );

    await waitIce();

    const sdp =
        pc.localDescription.sdp;

    await github(

        `/repos/${OWNER}/${REPO}/issues`,

        "POST",

        {
            title:"answer",
            body:sdp
        }
    );

    log("Answer 已上传");
}

function waitIce(){

    return new Promise(resolve=>{

        if(
            pc.iceGatheringState ===
            "complete"
        ){

            resolve();

        }else{

            pc.onicegatheringstatechange =
                ()=>{

                if(
                    pc.iceGatheringState ===
                    "complete"
                ){

                    resolve();
                }
            };
        }
    });
}

async function pollAnswer(){

    log("等待 Answer...");

    pollTimer = setInterval(async ()=>{
        const issues =
            await github(
                `/repos/${OWNER}/${REPO}/issues`
            );

        if(!issues)return;

        for(const i of issues){

            if(i.title === "answer"){

                log("收到 Answer");

                await pc.setRemoteDescription({

                    type:"answer",

                    sdp:i.body
                });
DELETE i
                return;
            }
        }

    },5000);
}

function sendMsg(){

    if(!dc){

        log("DataChannel 不存在");

        return;
    }

    if(dc.readyState !== "open"){

        log("P2P 尚未连接");

        return;
    }

    const v =
        document.getElementById("msg").value;

    dc.send(v);

    log("我: " + v);

    document.getElementById("msg").value = "";
}

let pollTimer = null;

function disconnect(){

    log("正在断开连接...");

    // 关闭 DataChannel
    if(dc){

        dc.close();

        dc = null;
    }

    // 关闭 PeerConnection
    if(pc){

        pc.close();

        pc = null;
    }

    // 停止轮询
    if(pollTimer){

        clearInterval(pollTimer);

        pollTimer = null;
    }

    log("连接已断开");
}

</script>

</body>
</html>
