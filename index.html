<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<!-- 禁止缓存 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub 阅后即焚 WebRTC</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

input,button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
}

input{
    width:260px;
}

button{
    background:#2d89ff;
    color:white;
}

#log{
    margin-top:20px;
    border:1px solid #444;
    padding:10px;
    height:350px;
    overflow:auto;
    white-space:pre-wrap;
    background:#000;
}

</style>

</head>
<body>

<h2>GitHub 阅后即焚 WebRTC</h2>

<div>
GitHub Token：
<br>
<input id="token" type="password" placeholder="输入 GitHub Token">
</div>

<br>

<button onclick="createRoom()">
创建房间
</button>

<br><br>

<input id="roomInput" placeholder="输入房间号">

<button onclick="joinRoom()">
加入房间
</button>

<hr>

<input id="msgInput" placeholder="输入消息">

<button onclick="sendMsg()">
发送
</button>

<div id="log"></div>

<script>

const OWNER = "mengdaodaomeng";
const REPO = "mengdaodaomeng.github.io";

let pc;
let dc;

let roomNumber = null;

let processedComments = new Set();

let pendingIce = [];

const clientId =
    Math.random().toString(36).substring(2);

const logDiv = document.getElementById("log");

function log(msg){

    console.log(msg);

    logDiv.innerHTML += msg + "\n";

    logDiv.scrollTop = logDiv.scrollHeight;
}

function headers(){

    return {

        "Authorization":
            "token " +
            document.getElementById("token").value,

        "Accept":
            "application/vnd.github+json"
    };
}

async function api(path, method="GET", body=null){

    let r = await fetch(

        `https://api.github.com/repos/${OWNER}/${REPO}${path}`,

        {
            method:method,
            headers:headers(),
            body: body ? JSON.stringify(body) : null
        }
    );

    if(method === "DELETE")
        return {};

    return await r.json();
}

async function clearOldRooms(){

    log("清理旧房间...");

    let issues = await api("/issues");

    for(let issue of issues){

        try{

            // 删除评论

            let comments =
                await api(
                    `/issues/${issue.number}/comments`
                );

            for(let c of comments){

                await fetch(

                    c.url,

                    {
                        method:"DELETE",
                        headers:headers()
                    }
                );
            }

            // 关闭 issue

            await api(

                `/issues/${issue.number}`,

                "PATCH",

                {
                    state:"closed"
                }
            );

        }catch(err){}
    }

    log("旧房间已清理");
}

function createPeer(){

    pc = new RTCPeerConnection({

        iceServers:[
            {
                urls:"stun:stun.l.google.com:19302"
            }
        ]
    });

    pc.onconnectionstatechange = ()=>{

        log("连接状态: " + pc.connectionState);
    };

    pc.oniceconnectionstatechange = ()=>{

        log("ICE状态: " + pc.iceConnectionState);
    };

    pc.onicecandidate = async e => {

        if(!e.candidate)
            return;

        log("发送 ICE");

        await sendSignal({

            type:"ice",

            data:e.candidate
        });
    };

    pc.ondatachannel = e => {

        log("收到 DataChannel");

        dc = e.channel;

        setupChannel();
    };
}

function setupChannel(){

    dc.onopen = ()=>{

        log("数据通道已连接");
    };

    dc.onclose = ()=>{

        log("数据通道已关闭");
    };

    dc.onmessage = e => {

        log("对方: " + e.data);
    };
}

async function sendSignal(obj){

    obj.from = clientId;

    obj.time = Date.now();

    await api(

        `/issues/${roomNumber}/comments`,

        "POST",

        {
            body:JSON.stringify(obj)
        }
    );
}

async function createRoom(){

    await clearOldRooms();

    createPeer();

    dc = pc.createDataChannel("chat");

    setupChannel();

    let issue = await api(

        "/issues",

        "POST",

        {
            title:"room-" + Date.now(),
            body:"signal"
        }
    );

    roomNumber = issue.number;

    log("房间号: " + roomNumber);

    let offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    log("发送 OFFER");

    await sendSignal({

        type:"offer",

        data:offer
    });

    pollSignals();
}

async function joinRoom(){

    roomNumber =
        document.getElementById("roomInput").value;

    createPeer();

    pollSignals();
}

async function handleSignal(msg){

    if(msg.from === clientId)
        return;

    // OFFER

    if(msg.type === "offer"){

        if(pc.remoteDescription)
            return;

        log("收到 OFFER");

        await pc.setRemoteDescription(

            new RTCSessionDescription(msg.data)
        );

        // 补加缓存 ICE

        for(let ice of pendingIce){

            try{

                await pc.addIceCandidate(

                    new RTCIceCandidate(ice)
                );

            }catch(err){}
        }

        pendingIce = [];

        let answer =
            await pc.createAnswer();

        await pc.setLocalDescription(answer);

        log("发送 ANSWER");

        await sendSignal({

            type:"answer",

            data:answer
        });
    }

    // ANSWER

    else if(msg.type === "answer"){

        if(pc.remoteDescription)
            return;

        log("收到 ANSWER");

        await pc.setRemoteDescription(

            new RTCSessionDescription(msg.data)
        );

        // 补加缓存 ICE

        for(let ice of pendingIce){

            try{

                await pc.addIceCandidate(

                    new RTCIceCandidate(ice)
                );

            }catch(err){}
        }

        pendingIce = [];
    }

    // ICE

    else if(msg.type === "ice"){

        if(pc.remoteDescription){

            try{

                await pc.addIceCandidate(

                    new RTCIceCandidate(msg.data)
                );

                log("添加 ICE");

            }catch(err){

                log("ICE 添加失败");
            }

        }else{

            pendingIce.push(msg.data);

            log("缓存 ICE");
        }
    }
}

async function pollSignals(){

    log("开始轮询信令");

    setInterval(async ()=>{

        try{

            let comments =
                await api(
                    `/issues/${roomNumber}/comments`
                );

            // 先排序

            comments.sort((a,b)=>{

                return a.id - b.id;
            });

            // 第一轮：
            // 先处理 offer/answer

            for(let c of comments){

                if(processedComments.has(c.id))
                    continue;

                try{

                    let msg =
                        JSON.parse(c.body);

                    if(
                        msg.type === "offer" ||
                        msg.type === "answer"
                    ){

                        await handleSignal(msg);

                        processedComments.add(c.id);

                        // 删除评论

                        await fetch(

                            c.url,

                            {
                                method:"DELETE",
                                headers:headers()
                            }
                        );
                    }

                }catch(err){}
            }

            // 第二轮：
            // 再处理 ICE

            for(let c of comments){

                if(processedComments.has(c.id))
                    continue;

                try{

                    let msg =
                        JSON.parse(c.body);

                    if(msg.type === "ice"){

                        await handleSignal(msg);

                        processedComments.add(c.id);

                        // 删除评论

                        await fetch(

                            c.url,

                            {
                                method:"DELETE",
                                headers:headers()
                            }
                        );
                    }

                }catch(err){}
            }

        }catch(err){

            log("轮询失败");
        }

    },1500);
}

function sendMsg(){

    let input =
        document.getElementById("msgInput");

    if(
        dc &&
        dc.readyState === "open"
    ){

        dc.send(input.value);

        log("我: " + input.value);

        input.value = "";
    }
}

</script>

</body>
</html>
