<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>多人 WebRTC 聊天</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>多人 WebRTC Mesh 聊天</h2>

<div class="top">

    <input id="token" placeholder="GitHub Token">

    <button onclick="saveToken()">
        保存Token
    </button>

    <button onclick="connectRoom()">
        加入聊天室
    </button>

    <button onclick="disconnectAll()">
        断开连接
    </button>

</div>

<div class="roomInfo">

    <div>
        我的ID：
        <span id="myId"></span>
    </div>

    <div>
        在线人数：
        <span id="onlineCount">0</span>
    </div>

</div>

<h3>在线用户</h3>

<div id="users"></div>

<h3>聊天记录</h3>

<div id="chat"></div>

<div class="bottom">

    <input id="msg" placeholder="输入消息">

    <button onclick="sendChat()">
        发送
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
