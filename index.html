<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GitHub WebRTC Chat</title>

<style>
body{
    font-family:Arial;
    padding:20px;
    background:#111;
    color:white;
}

button{
    padding:10px;
    margin:5px;
}

input{
    padding:10px;
    width:250px;
}

#log{
    border:1px solid #444;
    height:300px;
    overflow:auto;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>GitHub 阅后即焚 WebRTC</h2>

<div>
GitHub 用户名：
<input hiddened id="owner" value="mengdaodaomeng">
</div>

<div>
仓库名：
<input hiddened id="repo" value="mengdaodaomeng.github.io">
</div>

<div>
Token：
<input id="token" type="password" value="">
</div>

<hr>

<button onclick="createRoom()">创建房间</button>

<input id="roomInput" placeholder="输入房间号">

<button onclick="joinRoom()">加入房间</button>

<hr>

<input id="msgInput" placeholder="消息">

<button onclick="sendMsg()">发送</button>

<div id="log"></div>

<script>

let pc;
let dc;

let roomNumber = null;

const logDiv = document.getElementById("log");

function log(msg){
    console.log(msg);
    logDiv.innerHTML += msg + "\\n";
    logDiv.scrollTop = logDiv.scrollHeight;
}

function api(path, method="GET", body=null){

    const owner = document.getElementById("owner").value;
    const repo = document.getElementById("repo").value;
    const token = document.getElementById("token").value;

    return fetch(
        `https://api.github.com/repos/${owner}/${repo}${path}`,
        {
            method,
            headers:{
                "Authorization":"token " + token,
                "Accept":"application/vnd.github+json"
            },
            body: body ? JSON.stringify(body) : null
        }
    ).then(r=>r.json());
}

async function clearOldIssues(){

    log("清理旧房间...");

    let issues = await api("/issues");

    for(let issue of issues){

        await api(
            "/issues/" + issue.number,
            "PATCH",
            {
                state:"closed"
            }
        );

        let comments = await api(
            "/issues/" + issue.number + "/comments"
        );

        for(let c of comments){

            await fetch(
                c.url,
                {
                    method:"DELETE",
                    headers:{
                        "Authorization":"token " +
                        document.getElementById("token").value
                    }
                }
            );
        }
    }

    log("旧房间已清理");
}

function createPeer(){

    pc = new RTCPeerConnection({

        iceServers:[
            {
                urls:"stun:stun.l.google.com:19302"
            }
        ]
    });

    pc.onicecandidate = async e => {

        if(!e.candidate) return;

        await sendSignal({
            type:"ice",
            data:e.candidate
        });
    };

    pc.ondatachannel = e => {

        dc = e.channel;

        setupChannel();
    };
}

function setupChannel(){

    dc.onopen = ()=>{

        log("数据通道已连接");
    };

    dc.onmessage = e => {

        log("对方: " + e.data);
    };
}

async function createRoom(){

    await clearOldIssues();

    createPeer();

    dc = pc.createDataChannel("chat");

    setupChannel();

    let issue = await api(
        "/issues",
        "POST",
        {
            title:"room",
            body:"signal"
        }
    );

    roomNumber = issue.number;

    log("房间号: " + roomNumber);

    let offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    await sendSignal({
        type:"offer",
        data:offer
    });

    pollSignals();
}

async function joinRoom(){

    roomNumber =
        document.getElementById("roomInput").value;

    createPeer();

    pollSignals();
}

async function sendSignal(obj){

    await api(
        "/issues/" + roomNumber + "/comments",
        "POST",
        {
            body:JSON.stringify(obj)
        }
    );
}

async function pollSignals(){

    log("开始轮询信令...");

    setInterval(async ()=>{

        let comments = await api(
            "/issues/" + roomNumber + "/comments"
        );

        for(let c of comments){

            try{

                let msg = JSON.parse(c.body);

                if(msg.type === "offer"){

                    if(pc.remoteDescription) continue;

                    log("收到 OFFER");

                    await pc.setRemoteDescription(
                        new RTCSessionDescription(msg.data)
                    );

                    let answer =
                        await pc.createAnswer();

                    await pc.setLocalDescription(answer);

                    await sendSignal({
                        type:"answer",
                        data:answer
                    });
                }

                else if(msg.type === "answer"){

                    if(pc.remoteDescription) continue;

                    log("收到 ANSWER");

                    await pc.setRemoteDescription(
                        new RTCSessionDescription(msg.data)
                    );
                }

                else if(msg.type === "ice"){

                    try{

                        await pc.addIceCandidate(
                            new RTCIceCandidate(msg.data)
                        );

                    }catch(err){}
                }

                // 阅后即焚：立刻删除评论

                await fetch(
                    c.url,
                    {
                        method:"DELETE",
                        headers:{
                            "Authorization":"token " +
                            document.getElementById("token").value
                        }
                    }
                );

            }catch(err){}
        }

    },2000);
}

function sendMsg(){

    let input =
        document.getElementById("msgInput");

    if(dc && dc.readyState === "open"){

        dc.send(input.value);

        log("我: " + input.value);

        input.value = "";
    }
}

</script>

</body>
</html>
