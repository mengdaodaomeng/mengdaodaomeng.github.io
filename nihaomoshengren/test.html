<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>v3.0-b P2P Gist WebRTC</title>
<style>
body{font-family:Arial;padding:10px}
input,button{margin:5px}
#log{white-space:pre-wrap;background:#111;color:#0f0;padding:10px;height:300px;overflow:auto}
.green{color:lime}
</style>
</head>
<body>

<h3>v3.0-b WebRTC + Gist信令</h3>

<input id="token" placeholder="GitHub Token" style="width:300px"><br>
<input id="gistId" placeholder="Gist ID" style="width:300px"><br>
<input id="peerId" placeholder="Peer ID"><br>

<button onclick="createRoom()">创建房间(房主)</button>
<button onclick="joinRoom()">加入房间</button>
<button onclick="sendChat()">发送消息</button>

<div id="status"></div>
<div id="log"></div>

<script>

let token="", gist="", myId="", remoteId="";
let isHost=false;
let pc=null, dc=null;

let processed=new Set();
let pendingIce=[];

const log=t=>{
  document.getElementById("log").innerText+=t+"\n";
};

function github(url,method="GET",body=null){
  return fetch(url,{
    method,
    headers:{
      "Authorization":"token "+token,
      "Content-Type":"application/json"
    },
    body:body?JSON.stringify(body):null
  }).then(r=>r.json());
}

async function sendSignal(data){
  return github(
    `https://api.github.com/gists/${gist}/comments`,
    "POST",
    {body:JSON.stringify(data)}
  );
}

function setupPC(){

  pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"}
    ]
  });

  pc.onicecandidate=e=>{
    if(!e.candidate)return;

    sendSignal({
      msgId:crypto.randomUUID(),
      type:"candidate",
      from:myId,
      to:remoteId,
      candidate:e.candidate
    });
  };

  pc.onconnectionstatechange=()=>{
    log("PC:"+pc.connectionState);
  };

  pc.ondatachannel=e=>{
    dc=e.channel;
    bindDC();
  };
}

function bindDC(){

  dc.onopen=()=>{
    log("DataChannel OPEN");
  };

  dc.onmessage=e=>{
    log("[P2P] "+e.data);
  };
}

async function createRoom(){

  token=document.getElementById("token").value;
  gist=document.getElementById("gistId").value;
  myId=document.getElementById("peerId").value;

  isHost=true;

  log("房主启动:"+myId);

}

async function joinRoom(){

  token=document.getElementById("token").value;
  gist=document.getElementById("gistId").value;
  myId=document.getElementById("peerId").value;

  isHost=false;

  log("加入房间:"+myId);

  await sendSignal({
    msgId:crypto.randomUUID(),
    type:"join",
    from:myId
  });

  poll();
}

function poll(){

  setInterval(async()=>{

    let res=await github(
      `https://api.github.com/gists/${gist}/comments`
    );

    for(let c of res){

      let data;
      try{
        data=JSON.parse(c.body);
      }catch(e){
        continue;
      }

      if(!data.msgId)continue;

      if(processed.has(data.msgId))continue;
      processed.add(data.msgId);

      switch(data.type){

        case "join":
          if(isHost){
            handleJoin(data);
          }
          break;

        case "offer":
          if(data.to===myId)
            handleOffer(data);
          break;

        case "answer":
          if(data.to===myId)
            handleAnswer(data);
          break;

        case "candidate":
          if(data.to===myId)
            handleCandidate(data);
          break;
      }
    }

  },2000);
}

async function handleJoin(msg){

  remoteId=msg.from;

  log("收到JOIN:"+remoteId);

  setupPC();

  dc=pc.createDataChannel("chat");
  bindDC();

  let offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  sendSignal({
    msgId:crypto.randomUUID(),
    type:"offer",
    from:myId,
    to:remoteId,
    sdp:pc.localDescription
  });

  log("Offer已发送");
}

async function handleOffer(msg){

  remoteId=msg.from;

  setupPC();

  await pc.setRemoteDescription(
    msg.sdp
  );

  let answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  sendSignal({
    msgId:crypto.randomUUID(),
    type:"answer",
    from:myId,
    to:remoteId,
    sdp:pc.localDescription
  });

  log("Answer已发送");
}

async function handleAnswer(msg){

  await pc.setRemoteDescription(msg.sdp);

  log("Answer已应用");
}

async function handleCandidate(msg){

  try{
    await pc.addIceCandidate(msg.candidate);
  }catch(e){
    pendingIce.push(msg.candidate);
  }
}

function sendChat(){

  let msg="hello "+Date.now();

  if(dc&&dc.readyState==="open"){
    dc.send(msg);
    log("[ME] "+msg);
  }else{
    log("未连接");
  }
}

</script>
</body>
</html>
