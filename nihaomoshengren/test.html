<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>v3.0-b-lite P2P</title>
<style>
body{font-family:Arial;padding:10px}
input,button{margin:5px}
#log{white-space:pre-wrap;background:#111;color:#0f0;padding:10px;height:300px;overflow:auto}
</style>
</head>
<body>

<h3>v3.0-b-lite（自动房间 + P2P）</h3>

<input id="token" placeholder="GitHub Token" style="width:320px"><br>

<button onclick="start()">启动 / 自动加入网络</button>
<button onclick="sendChat()">发送消息</button>

<div id="log"></div>

<script>

let token="";
let gistId="";
let myId="";
let remoteId="";
let isHost=false;

let pc=null;
let dc=null;

let processed=new Set();

const log=t=>{
  document.getElementById("log").innerText+=t+"\n";
};

function randId(){
  return "peer_"+Math.random().toString(36).substr(2,8);
}

async function github(url,method="GET",body=null){

  return fetch(url,{
    method,
    headers:{
      "Authorization":"token "+token,
      "Content-Type":"application/json"
    },
    body:body?JSON.stringify(body):null
  }).then(r=>r.json());
}

async function createRoom(){

  let res=await github(
    "https://api.github.com/gists",
    "POST",
    {
      description:"room for anyone",
      public:false,
      files:{
        "room.json":{
          content:JSON.stringify({
            type:"room",
            name:"room for anyone"
          })
        }
      }
    }
  );

  gistId=res.id;

  log("创建房间:"+gistId);
}

async function sendSignal(data){

  await github(
    `https://api.github.com/gists/${gistId}/comments`,
    "POST",
    {body:JSON.stringify(data)}
  );
}

function setupPC(){

  pc=new RTCPeerConnection({
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"}
    ]
  });

  pc.onicecandidate=e=>{
    if(!e.candidate)return;

    sendSignal({
      msgId:crypto.randomUUID(),
      type:"candidate",
      from:myId,
      to:remoteId,
      candidate:e.candidate
    });
  };

  pc.ondatachannel=e=>{
    dc=e.channel;
    bindDC();
  };
}

function bindDC(){

  dc.onopen=()=>{
    log("✔ DataChannel OPEN");
  };

  dc.onmessage=e=>{
    log("[P2P] "+e.data);
  };
}

async function start(){

  token=document.getElementById("token").value;

  myId=randId();

  log("我的ID:"+myId);

  await createRoom();

  isHost=true;

  poll();

}

async function poll(){

  setInterval(async()=>{

    let res=await github(
      `https://api.github.com/gists/${gistId}/comments`
    );

    for(let c of res){

      let data;
      try{
        data=JSON.parse(c.body);
      }catch(e){
        continue;
      }

      if(!data.msgId)continue;

      if(processed.has(data.msgId))continue;
      processed.add(data.msgId);

      switch(data.type){

        case "join":
          if(isHost) handleJoin(data);
          break;

        case "offer":
          if(data.to===myId) handleOffer(data);
          break;

        case "answer":
          if(data.to===myId) handleAnswer(data);
          break;

        case "candidate":
          if(data.to===myId) handleCandidate(data);
          break;
      }
    }

  },2000);
}

async function join(){

  await sendSignal({
    msgId:crypto.randomUUID(),
    type:"join",
    from:myId
  });

  log("发送JOIN");
}

async function handleJoin(msg){

  remoteId=msg.from;

  log("收到JOIN:"+remoteId);

  setupPC();

  dc=pc.createDataChannel("chat");
  bindDC();

  let offer=await pc.createOffer();
  await pc.setLocalDescription(offer);

  await sendSignal({
    msgId:crypto.randomUUID(),
    type:"offer",
    from:myId,
    to:remoteId,
    sdp:pc.localDescription
  });

  log("发送OFFER");
}

async function handleOffer(msg){

  remoteId=msg.from;

  setupPC();

  await pc.setRemoteDescription(msg.sdp);

  let answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await sendSignal({
    msgId:crypto.randomUUID(),
    type:"answer",
    from:myId,
    to:remoteId,
    sdp:pc.localDescription
  });

  log("发送ANSWER");
}

async function handleAnswer(msg){

  await pc.setRemoteDescription(msg.sdp);

  log("✔ CONNECTED (answer applied)");
}

async function handleCandidate(msg){

  try{
    await pc.addIceCandidate(msg.candidate);
  }catch(e){}
}

function sendChat(){

  if(dc && dc.readyState==="open"){
    dc.send("hello "+Date.now());
    log("[ME] message sent");
  }else{
    log("未连接");
  }
}

</script>

</body>
</html>
