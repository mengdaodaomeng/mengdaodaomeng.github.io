<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GitHub Gist API</title>
<style>
body{
    font-family:Arial;
    padding:20px;
}
input,button{
    margin:5px;
    padding:8px;
}
input{
    width:500px;
}
pre{
    background:#f0f0f0;
    padding:10px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>GitHub Gist API 测试</h2>

<div>
    <input id="token" type="password"
           placeholder="GitHub Token">
</div>

<div>
    <input id="gistId"
           placeholder="Gist ID">
</div>

<div>
    <button onclick="createGist()">创建</button>
    <button onclick="readGist()">读取</button>
    <button onclick="updateGist()">更新</button>
    <button onclick="deleteGist()">删除</button>
</div>

<pre id="result"></pre>

<script>

function log(msg){
    document.getElementById("result").textContent =
        typeof msg === "string"
        ? msg
        : JSON.stringify(msg,null,2);
}

function getToken(){
    return document.getElementById("token").value.trim();
}

function getGistId(){
    return document.getElementById("gistId").value.trim();
}

async function createGist(){

    const token=getToken();

    const body={
        description:"WebRTC Offer",
        public:false,
        files:{
            "offer.json":{
                content:JSON.stringify({
                    type:"offer",
                    time:Date.now(),
                    message:"hello"
                },null,2)
            }
        }
    };

    const res=await fetch(
        "https://api.github.com/gists",
        {
            method:"POST",
            headers:{
                Authorization:"token "+token,
                Accept:"application/vnd.github+json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify(body)
        }
    );

    const json=await res.json();

    if(res.ok){

        document.getElementById("gistId").value =
            json.id;

        log({
            status:"创建成功",
            gistId:json.id,
            url:json.html_url
        });

    }else{
        log(json);
    }
}

async function readGist(){

    const token=getToken();
    const gistId=getGistId();

    const res=await fetch(
        "https://api.github.com/gists/"+gistId,
        {
            headers:{
                Authorization:"token "+token,
                Accept:"application/vnd.github+json"
            }
        }
    );

    const json=await res.json();

    if(res.ok){

        const file=json.files["offer.json"];

        if(file){
            log(file.content);
        }else{
            log("offer.json不存在");
        }

    }else{
        log(json);
    }
}

async function updateGist(){

    const token=getToken();
    const gistId=getGistId();

    const body={
        files:{
            "offer.json":{
                content:JSON.stringify({
                    type:"offer",
                    updated:true,
                    time:Date.now()
                },null,2)
            }
        }
    };

    const res=await fetch(
        "https://api.github.com/gists/"+gistId,
        {
            method:"PATCH",
            headers:{
                Authorization:"token "+token,
                Accept:"application/vnd.github+json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify(body)
        }
    );

    const json=await res.json();

    if(res.ok){
        log("更新成功");
    }else{
        log(json);
    }
}

async function deleteGist(){

    const token=getToken();
    const gistId=getGistId();

    const ok=confirm("确定删除？");

    if(!ok)return;

    const res=await fetch(
        "https://api.github.com/gists/"+gistId,
        {
            method:"DELETE",
            headers:{
                Authorization:"token "+token,
                Accept:"application/vnd.github+json"
            }
        }
    );

    if(res.status===204){

        log("删除成功");

        document.getElementById("gistId").value="";

    }else{

        const txt=await res.text();

        log(txt);
    }
}

</script>

</body>
</html>
