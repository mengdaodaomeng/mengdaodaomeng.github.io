<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Gist Signal v3.0-a</title>

<style>
body{
    font-family:Arial;
    padding:15px;
}

input,button{
    padding:8px;
    margin:3px;
}

input{
    width:100%;
    box-sizing:border-box;
}

#log{
    height:300px;
    overflow:auto;
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
    background:#fafafa;
    white-space:pre-wrap;
}

.green{
    color:green;
    font-weight:bold;
}

.red{
    color:red;
    font-weight:bold;
}
</style>
</head>
<body>

<h2>Gist Signal v3.0-a</h2>

Token

<input id="token" type="password">

<button onclick="saveToken()">
保存Token
</button>

<hr>

房间名

<input id="roomName" value="TestRoom">

<button onclick="createRoom()">
创建房间
</button>

<hr>

Gist ID

<input id="gistId">

<button onclick="joinRoom()">
加入房间
</button>

<hr>

我的ID

<input id="peerId">

<button onclick="generatePeerId()">
生成ID
</button>

<hr>

消息

<input id="message">

<button onclick="sendChat()">
发送评论
</button>

<hr>

状态:

<span id="status" class="red">
未连接
</span>

<hr>

最新评论ID:

<span id="lastId">
0
</span>

<div id="log"></div>

<script>

let polling=null;
let lastCommentId=0;

window.onload=()=>{

    token.value=
        localStorage.getItem("github_token")||"";

    peerId.value=
        "peer_"+Math.random()
            .toString(36)
            .substring(2,8);
};

function generatePeerId(){

    peerId.value=
        "peer_"+Math.random()
            .toString(36)
            .substring(2,8);
}

function saveToken(){

    localStorage.setItem(
        "github_token",
        token.value
    );

    log("Token已保存");
}

function log(msg){

    const box=
        document.getElementById("log");

    box.innerHTML +=
        msg + "<br>";

    box.scrollTop=
        box.scrollHeight;
}

async function github(url,method="GET",body=null){

    const res=
        await fetch(url,{
            method,
            headers:{
                Authorization:
                    "token "+token.value,
                Accept:
                    "application/vnd.github+json",
                "Content-Type":
                    "application/json"
            },
            body:
                body
                ? JSON.stringify(body)
                : null
        });

    if(method==="DELETE")
        return res;

    return await res.json();
}

async function createRoom(){

    try{

        const room={
            version:"3.0-a",
            roomName:
                roomName.value,
            host:
                peerId.value,
            created:
                Date.now()
        };

        const gist=
            await github(
                "https://api.github.com/gists",
                "POST",
                {
                    public:false,
                    files:{
                        "room.json":{
                            content:
                                JSON.stringify(
                                    room,
                                    null,
                                    2
                                )
                        }
                    }
                }
            );

        gistId.value=
            gist.id;

        log(
            "房间创建成功<br>"
            + gist.id
        );

        startPolling();

    }catch(e){

        log(
            "创建失败: "
            + e
        );
    }
}

async function joinRoom(){

    try{

        await github(
            `https://api.github.com/gists/${gistId.value}/comments`,
            "POST",
            {
                body:JSON.stringify({
                    type:"join",
                    from:peerId.value,
                    time:Date.now()
                })
            }
        );

        log("已发送join");

        startPolling();

    }catch(e){

        log(
            "加入失败: "
            + e
        );
    }
}

async function sendChat(){

    try{

        await github(
            `https://api.github.com/gists/${gistId.value}/comments`,
            "POST",
            {
                body:JSON.stringify({
                    type:"chat",
                    from:peerId.value,
                    text:message.value,
                    time:Date.now()
                })
            }
        );

        message.value="";

    }catch(e){

        log(
            "发送失败: "
            + e
        );
    }
}

function startPolling(){

    if(polling)
        clearInterval(polling);

    status.innerHTML="轮询中";
    status.className="green";

    loadComments();

    polling=
        setInterval(
            loadComments,
            3000
        );
}

async function loadComments(){

    if(!gistId.value)
        return;

    try{

        const comments=
            await github(
                `https://api.github.com/gists/${gistId.value}/comments`
            );

        comments.forEach(c=>{

            if(c.id<=lastCommentId)
                return;

            lastCommentId=
                c.id;

            document
                .getElementById(
                    "lastId"
                )
                .innerText=
                lastCommentId;

            try{

                const data=
                    JSON.parse(
                        c.body
                    );

                log(
                    "["+
                    data.type+
                    "] "
                    +
                    data.from
                    +
                    " : "
                    +
                    (
                        data.text
                        || ""
                    )
                );

            }catch{

                log(
                    c.body
                );
            }
        });

    }catch(e){

        log(
            "轮询失败: "
            + e
        );
    }
}

</script>

</body>
</html>
