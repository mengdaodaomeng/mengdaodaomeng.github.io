<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<title>GGSP v2.2 PRO MVP</title>

<style>
body { background:#111; color:#0f0; font-family:monospace; padding:10px; }
input,button { padding:8px; margin:5px; }
#log { height:300px; overflow:auto; border:1px solid #333; padding:10px; }
</style>
</head>

<body>

<h2>GGSP v2.2 PRO</h2>

<!-- TOKEN -->
<input id="token" placeholder="GitHub Token">

<br>

<!-- ROOM -->
<input id="gistId" placeholder="Gist ID（加入用，可空）">

<br><br>

<button onclick="createRoom()">创建房间</button>
<button onclick="joinRoom()">加入房间</button>

<br><br>

<input id="msg" placeholder="消息">
<button onclick="sendMsg()">发送</button>

<br><br>

<button onclick="clearLog()">清空</button>

<pre id="log"></pre>

<script src="app.js"></script>

</body>
</html>
